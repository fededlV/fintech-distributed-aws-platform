server {
    server_tokens off;
    listen       443 ssl;
    resolver 127.0.0.11 valid=30s;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Health check for Edge / ALB / Route53
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # Security: Block sensitive internal diagnostic and dump paths
    location ~* /(actuator/(env|heapdump|threaddump)|debug/pprof) {
        deny all;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Reverse proxy mappings to polyglot microservice containers.
    # Service hostnames match docker-compose.yml service keys.

    location ~ ^/api/(clientes|clients) {
        set $upstream api-clients:8080;
        rewrite ^/api/(?:clientes|clients)(.*)$ /clientes$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(pagos|payments) {
        set $upstream api-payments:8080;
        rewrite ^/api/(?:pagos|payments)(.*)$ /pagos$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(facturas|invoices) {
        set $upstream api-invoices:8080;
        rewrite ^/api/(?:facturas|invoices)(.*)$ /facturas$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(transacciones|transactions) {
        set $upstream api-transactions:8080;
        rewrite ^/api/(?:transacciones|transactions)(.*)$ /transacciones$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(tarjetas|cards) {
        set $upstream api-cards:8080;
        rewrite ^/api/(?:tarjetas|cards)(.*)$ /tarjetas$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
